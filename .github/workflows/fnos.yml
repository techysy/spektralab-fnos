# Build the fnOS deliverables on a hosted runner:
#   build.sh              -> engine host (debian:12, lavapipe CTest, glibc gate) + headless image
#   webui/build-webui.sh  -> frontend (upstream desktop + overlay) + WebUI image + bridge smoke
#   fpk job               -> SpektraLab-FnOS-<version>-{window,tab}-x86.fpk (fnpack in CI, pinned)
# Tag pushes (v*) attach everything to a GitHub Release.
#
# The two fpk variants share the appname and the data dir: install one over
# the other to switch between "Tab" (browser new tab over :8777) and
# "Window" (fnOS unified-gateway iframe, NAS login state + per-user headers).
#
# Upstream updates stay a one-line change: bump UPSTREAM_PIN, push, and this
# workflow rebuilds all deliverables through the same verified gates.
name: fnOS image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: fnos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Engine + WebUI images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Runner disk is fast; no dep seed needed (the container fetches and
      # verifies LibRaw itself, with a pinned git clone fallback).
      - name: Build engine host, verify, package headless image
        run: bash build.sh

      - name: Build WebUI (frontend + bridge image + smoke)
        run: bash webui/build-webui.sh

      - uses: actions/upload-artifact@v4
        with:
          name: spektralab-fnos-images
          path: |
            dist/spektralab-fnos-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      # the native fpk payload: engine bundle + built frontend
      - uses: actions/upload-artifact@v4
        with:
          name: spektralab-fnos-payload
          path: |
            upstream/build/host-linux-x64/
            webui/frontend/dist/
          if-no-files-found: error
          retention-days: 30

  fpk:
    name: fpk (${{ matrix.variant }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [tab, window]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the payload (engine bundle + frontend)
        uses: actions/download-artifact@v4
        with:
          name: spektralab-fnos-payload
          path: payload/

      - name: Stage the fpk project for this variant
        env:
          FPK_VARIANT: ${{ matrix.variant }}
          SPEKTRALAB_HOST_BUNDLE: ${{ github.workspace }}/payload/upstream/build/host-linux-x64
          SPEKTRALAB_WWW_DIST: ${{ github.workspace }}/payload/webui/frontend/dist
        run: bash webui/pack-fpk.sh

      # manifest hard gates (the app center silently mis-installs or crashes on
      # a wrong appname/version/wizard -- all three bit us once; see
      # TROUBLESHOOTING.md): fail the build before fnpack ever runs
      - name: Verify the staged fpk project
        working-directory: webui/fpk-dist/spektralab
        run: |
          set -euo pipefail
          echo "== manifest required fields =="
          for k in appname version display_name desc maintainer platform service_port; do
            grep -qE "^${k}[[:space:]]*=" manifest || { echo "ERROR: manifest missing ${k}"; exit 1; }
          done
          APPNAME="$(grep -E '^appname=' manifest | cut -d= -f2 | tr -d ' \r')"
          [ "$APPNAME" = "spektralab" ] || { echo "ERROR: appname must stay 'spektralab' (gateway path /app/spektralab + data dir are derived from it)"; exit 1; }
          VERSION="$(grep -E '^version=' manifest | cut -d= -f2 | tr -d ' \r')"
          # fpk-dist/spektralab -> repo root is three levels up (fpk-dist/spektralab/../.. = webui)
          [ "$VERSION" = "$(tr -d ' \r\n' < ../../../VERSION)" ] || { echo "ERROR: manifest version ($VERSION) != repo-root VERSION ($(tr -d ' \r\n' < ../../../VERSION 2>/dev/null))"; exit 1; }
          echo "== desc carries exactly one 【】 prefix =="
          DESC="$(grep -E '^desc=' manifest)"
          N=$(printf '%s' "$DESC" | grep -o '【' | wc -l)
          [ "$N" -eq 1 ] || { echo "ERROR: desc has $N 【】 groups (expected 1, the variant prefix)"; exit 1; }
          echo "== wizard/install is a non-empty form (app center 10111 on empty) =="
          python3 -c "import json,sys; a=json.load(open('wizard/install', encoding='utf-8')); assert isinstance(a,list) and len(a)>0, 'wizard/install must be a non-empty array'"
          echo "== lifecycle scripts present and parseable =="
          for s in main install_callback uninstall_callback upgrade_callback; do
            [ -f "cmd/${s}" ] || { echo "ERROR: cmd/${s} missing"; exit 1; }
            bash -n "cmd/${s}" || { echo "ERROR: cmd/${s} syntax"; exit 1; }
          done
          echo "staged fpk project verified (appname=$APPNAME version=$VERSION)"

      - name: Download fnpack (pinned)
        env:
          FNPACK_VERSION: "1.2.1"
          FNPACK_SHA256: "72d2a4095da676b64510b023731a227b369d80f8079bc45ff8a2f802ec0480c1"
        run: |
          curl -fsSL -o /usr/local/bin/fnpack "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "${FNPACK_SHA256}  /usr/local/bin/fnpack" | sha256sum -c -
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3

      - name: Build fpk
        working-directory: webui/fpk-dist/spektralab
        run: |
          set -euo pipefail
          rm -f spektralab.fpk
          fnpack build
          VERSION="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          [ -n "$VERSION" ] || { echo "ERROR: no version in manifest"; exit 1; }
          # naming: SpektraLab-FnOS-<version>-<variant>-x86.fpk -- version right
          # after the project name, variant lowercase (window | tab)
          VARIANT="${{ matrix.variant }}"
          OUT="SpektraLab-FnOS-${VERSION}-${VARIANT}-x86.fpk"
          mv spektralab.fpk "$OUT"
          ls -lh "$OUT"
          echo "FPK_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: spektralab-fnos-fpk-${{ matrix.variant }}
          path: webui/fpk-dist/spektralab/SpektraLab-FnOS-*.fpk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build, fpk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download the image artifacts
        uses: actions/download-artifact@v4
        with:
          path: rel/
          name: spektralab-fnos-images

      - name: Download the fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: rel/
          pattern: spektralab-fnos-fpk-*
          merge-multiple: true

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

      - name: Checksum + upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh rel/
          # one checksum file for everything: the names are self-describing now
          ( cd rel && sha256sum SpektraLab-FnOS-*.fpk spektralab-fnos-*.tar.gz > SHA256SUMS )
          N=$(ls rel/SpektraLab-FnOS-*.fpk rel/spektralab-fnos-*.tar.gz rel/SHA256SUMS | wc -l)
          [ "$N" -ge 6 ] || { echo "ERROR: expected >=6 files (2 fpk + 2 images + host bundle + sums), found $N"; exit 1; }
          gh release upload "${{ github.ref_name }}" rel/* --clobber
          echo "attached to release ${{ github.ref_name }}"
