# Build the fnOS deliverable on a hosted runner: debian:12 container build,
# lavapipe CTest + host smoke, glibc gate, runtime image, dist artifacts.
# Tag pushes (v*) additionally attach the artifacts to a GitHub Release.
name: fnOS image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: fnos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build + verify + package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Runner disk is fast; no dep seed needed (the container fetches and
      # verifies LibRaw itself, with a pinned git clone fallback).
      - name: Build, verify, package
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: spektralab-fnos
          path: |
            dist/spektralab-fnos-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the tag's release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" 2>/dev/null || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/spektralab-fnos-*.tar.gz dist/SHA256SUMS --clobber
          echo "attached to release $tag"
