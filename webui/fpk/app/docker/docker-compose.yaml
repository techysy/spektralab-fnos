# SpektraLab fnOS app -- engine host + bridge, one container.
#
# The fnOS app framework starts this compose project (config/resource
# docker-project) and injects TRIM_* environment variables (TRIM_API_TOKEN,
# TRIM_APPDEST, TRIM_PKGVAR, TRIM_UID, ...) into the container automatically.
#
# Networking: the bridge serves the WebUI on the unified-gateway unix socket
# (app.sock under the app's target dir, bind-mounted at /sock).  fnOS forwards
# /app/spektralab-fnos there after checking the NAS login session; the app
# reads X-Trim-Userid / X-Trim-Isadmin per request.  No TCP port is exposed
# under fnOS (SPEKTRALAB_FNOS_PORT=0).  A healthcheck probes the socket.
#
# Files: photo roots are authorized at runtime through the trim open API
# (shared grants + per-user grants, ACL-checked per request).  The container
# still needs to SEE those paths, so the NAS storage volumes are mounted
# read-only at their real paths (/vol1, /vol02, ...).  Path validation never
# trusts the mount alone: bridge.py clamps every path to trim-reported roots
# and gates each user through trim.file.checkUserACL.  Exported files land in
# /data (the app's var dir, TRIM_PKGVAR) -- writable, app-owned.
#
# GPU: /dev/dri passthrough + video/render groups; Mesa ANV picks up the iGPU
# (e.g. Intel UHD 730) and the engine renders on it, lavapipe is the fallback.

services:
  spektralab:
    image: spektralab-fnos:webui
    container_name: spektralab-fnos
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri          # iGPU passthrough
    group_add:
      # Debian-stable GIDs (video=44, render=105): compose's named group_add
      # resolves on a path that misses NSS-only entries on some fnOS builds.
      - "44"
      - "105"
    environment:
      # unified gateway socket, created inside the mounted app target dir
      SPEKTRALAB_FNOS_SOCKET: /host-target/app.sock
      # the bridge strips this prefix from gateway-forwarded requests
      # (keep in sync with app/ui/config gatewayPrefix)
      SPEKTRALAB_GATEWAY_PREFIX: /app/spektralab
      # the bridge listens on the manifest's service_port (fnOS injects it);
      # the ui/config entry opens http://<nas>:$TRIM_SERVICE_PORT/
      SPEKTRALAB_FNOS_PORT: ${TRIM_SERVICE_PORT:-8777}
      # fnOS mode: the bridge detects the trim socket and queries roots/ACL
      # through it (needs TRIM_API_TOKEN in the container env).  Until the
      # framework injects it into compose containers, these env roots keep the
      # photo library browsable: the two storage volumes are mounted read-only
      # below at their real paths, per-user ACL then applies via the gateway.
      SPEKTRALAB_PHOTOS_ROOTS: "/vol1;/vol02"
      SPEKTRALAB_DEVICE: ""
      SPEKTRALAB_FNOS_VERSION: ${TRIM_APPVER:-0.2.1}
      # TRIM_API_TOKEN / TRIM_APPNAME / TRIM_UID / TRIM_APPDEST / TRIM_PKGVAR
      # are injected by the fnOS app framework; nothing to set here.
    ports:
      # port-service entry: publish the manifest's service port (TRIM_SERVICE_PORT
      # is injected by the fnOS framework; 8777 matches manifest.service_port)
      - "${TRIM_SERVICE_PORT:-8777}:${TRIM_SERVICE_PORT:-8777}"
    volumes:
      # the app target dir, rw: the bridge creates the gateway socket in it
      # (/target/app.sock on the container side => ${TRIM_APPDEST}/app.sock on
      # the host, exactly where the fnOS gateway looks).  Mounting the
      # directory -- not a pre-existing socket file -- sidesteps docker's
      # "missing file becomes a directory" bind-mount trap and survives
      # uninstall/reinstall cycles.
      - ${TRIM_APPDEST}:/host-target
      # app data (stores, inbox uploads, exports): TRIM_PKGVAR points at
      # /vol{n}/@appdata/{appname} -- writable and persistent across upgrades
      - ${TRIM_PKGVAR}:/data
      # NAS storage volumes at their REAL paths: trim-granted photo paths are
      # /vol1/... or /vol02/... and must exist unchanged inside the container.
      # Read-only: the engine only reads photographs; exports go to /data.
      - /vol1:/vol1:ro
      - /vol02:/vol02:ro
      # trim open-API socket: the bridge calls it per request for roots + ACL
      - /var/run/trim_open_gateway_apiscope.socket:/var/run/trim_open_gateway_apiscope.socket:ro
    healthcheck:
      # healthcheck.py (in the image) probes the bridge through the gateway
      # unix socket when SPEKTRALAB_FNOS_SOCKET is set, else the TCP port
      test: ["CMD", "python3", "/opt/bridge/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
